<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zgff667 - Personal Space</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0a0f;
            --bg-card: rgba(255, 255, 255, 0.03);
            --border-card: rgba(255, 255, 255, 0.08);
            --text-primary: #f0f0f5;
            --text-secondary: #8a8a9a;
            --accent: #7c5cff;
            --accent-2: #00d4ff;
            --glow: rgba(124, 92, 255, 0.3);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Aurora background */
        .aurora {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .aurora::before,
        .aurora::after {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            animation: aurora 12s ease-in-out infinite alternate;
        }

        .aurora::before {
            background: radial-gradient(circle, var(--accent), transparent 70%);
            top: -200px;
            right: -100px;
        }

        .aurora::after {
            background: radial-gradient(circle, var(--accent-2), transparent 70%);
            bottom: -200px;
            left: -100px;
            animation-delay: -6s;
            animation-direction: alternate-reverse;
        }

        @keyframes aurora {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(60px, -40px) scale(1.1); }
            66% { transform: translate(-40px, 60px) scale(0.9); }
            100% { transform: translate(30px, -30px) scale(1.05); }
        }

        /* Hero section */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
        }

        .avatar-wrapper {
            position: relative;
            margin-bottom: 32px;
        }

        .avatar-wrapper::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: conic-gradient(var(--accent), var(--accent-2), var(--accent));
            animation: spin 4s linear infinite;
            opacity: 0.7;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            position: relative;
            border: 4px solid var(--bg-primary);
            display: block;
        }

        .hero h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .typewriter {
            font-size: clamp(1rem, 2.5vw, 1.25rem);
            color: var(--text-secondary);
            min-height: 1.8em;
            text-align: center;
            max-width: 600px;
        }

        .typewriter .cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background: var(--accent);
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .social-links {
            display: flex;
            gap: 16px;
            margin-top: 32px;
        }

        .social-links a {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .social-links a:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 8px 24px var(--glow);
        }

        .scroll-hint {
            position: absolute;
            bottom: 40px;
            animation: bounce 2s infinite;
            color: var(--text-secondary);
            font-size: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(8px); }
            60% { transform: translateY(4px); }
        }

        /* Sections */
        .section {
            max-width: 1000px;
            margin: 0 auto;
            padding: 80px 24px;
        }

        .section-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 28px;
            background: linear-gradient(180deg, var(--accent), var(--accent-2));
            border-radius: 4px;
        }

        /* About card */
        .glass-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 20px;
            padding: 36px;
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            border-color: rgba(124, 92, 255, 0.3);
            box-shadow: 0 8px 40px rgba(124, 92, 255, 0.1);
        }

        .about-text {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.8;
            margin-bottom: 28px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .tag {
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(124, 92, 255, 0.1);
            border: 1px solid rgba(124, 92, 255, 0.2);
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .tag:hover {
            background: rgba(124, 92, 255, 0.2);
            transform: translateY(-2px);
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 60px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: rgba(124, 92, 255, 0.3);
            transform: translateY(-3px);
        }

        .stat-card .num {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-card .label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Repos grid */
        .repos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        .repo-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .repo-card:hover {
            border-color: rgba(124, 92, 255, 0.3);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(124, 92, 255, 0.1);
        }

        .repo-card a {
            color: var(--text-primary);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            transition: color 0.2s;
        }

        .repo-card a:hover { color: var(--accent); }

        .repo-card .desc {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 10px;
            flex: 1;
        }

        .repo-card .meta {
            margin-top: 16px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            align-items: center;
        }

        .repo-card .meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .lang-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        /* Fade-in animation */
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Loading state */
        .loading-text {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px;
            font-size: 0.95rem;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-card);
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .repos-grid {
                grid-template-columns: 1fr;
            }
            .section {
                padding: 60px 16px;
            }
            .glass-card {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="aurora"></div>

    <!-- Hero -->
    <section class="hero">
        <div class="avatar-wrapper">
            <img class="avatar" src="https://github.com/zgff667.png" alt="avatar">
        </div>
        <h1>学无止境</h1>
        <div class="typewriter" id="typewriter"><span class="cursor"></span></div>
        <div class="social-links">
            <a href="https://github.com/zgff667" target="_blank" title="GitHub">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                </svg>
            </a>
        </div>
        <div class="scroll-hint">
            <span>向下探索</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M7 13l5 5 5-5M7 6l5 5 5-5"/>
            </svg>
        </div>
    </section>

    <!-- About -->
    <section class="section fade-in">
        <h2 class="section-title">关于我</h2>
        <div class="glass-card">
            <p class="about-text">
                很高兴和大家相识！我是一名热爱技术的开发者，坚信学习是永无止境的旅程。<br><br>
                喜欢探索新技术、解决有趣的问题。希望能和志同道合的朋友一起努力学习提升自己，能量大的时候去改变世界。
            </p>
            <div class="tags">
                <span class="tag">Android 安全</span>
                <span class="tag">逆向工程</span>
                <span class="tag">Python</span>
                <span class="tag">移动开发</span>
                <span class="tag">CTF</span>
                <span class="tag">持续学习</span>
            </div>
        </div>
    </section>

    <!-- GitHub -->
    <section class="section fade-in">
        <h2 class="section-title">开源项目</h2>
        <div class="stats-grid" id="stats">
            <div class="stat-card">
                <div class="num" id="stat-repos">--</div>
                <div class="label">Repos</div>
            </div>
            <div class="stat-card">
                <div class="num" id="stat-followers">--</div>
                <div class="label">Followers</div>
            </div>
            <div class="stat-card">
                <div class="num" id="stat-following">--</div>
                <div class="label">Following</div>
            </div>
        </div>
        <div class="repos-grid" id="repos">
            <div class="loading-text">正在加载仓库数据...</div>
        </div>
    </section>

    <footer>
        <p>&copy; 2024 zgff667 · Built with ❤️</p>
    </footer>

    <script>
        // Typewriter effect
        const phrases = [
            '让我们一起努力学习提升自己',
            'Stay hungry, stay foolish.',
            '能量大的时候去改变世界',
            'Keep learning, keep growing.'
        ];
        let phraseIdx = 0, charIdx = 0, deleting = false;
        const typeEl = document.getElementById('typewriter');

        function type() {
            const current = phrases[phraseIdx];
            if (!deleting) {
                typeEl.innerHTML = current.slice(0, charIdx + 1) + '<span class="cursor"></span>';
                charIdx++;
                if (charIdx === current.length) {
                    setTimeout(() => { deleting = true; type(); }, 2000);
                    return;
                }
                setTimeout(type, 80);
            } else {
                typeEl.innerHTML = current.slice(0, charIdx - 1) + '<span class="cursor"></span>';
                charIdx--;
                if (charIdx === 0) {
                    deleting = false;
                    phraseIdx = (phraseIdx + 1) % phrases.length;
                    setTimeout(type, 500);
                    return;
                }
                setTimeout(type, 40);
            }
        }
        type();

        // Scroll fade-in
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

        // GitHub data
        const USERNAME = 'zgff667';
        const LANG_COLORS = {
            'Python': '#3572A5', 'JavaScript': '#f1e05a', 'Java': '#b07219',
            'C': '#555555', 'C++': '#f34b7d', 'Go': '#00ADD8', 'Rust': '#dea584',
            'TypeScript': '#3178c6', 'HTML': '#e34c26', 'CSS': '#563d7c',
            'Shell': '#89e051', 'Kotlin': '#A97BFF', 'Swift': '#F05138',
            'Ruby': '#701516', 'PHP': '#4F5D95', 'Dart': '#00B4AB',
        };

        const FALLBACK_REPOS = [
            { name: 'zgff667.github.io', html_url: 'https://github.com/zgff667/zgff667.github.io', description: '个人主页 - Modern glassmorphism design', language: 'HTML', stargazers_count: 0, forks_count: 0, fork: false },
            { name: 'WalleLibrary', html_url: 'https://github.com/zgff667/WalleLibrary', description: 'Walle多渠道打包工具库', language: 'Java', stargazers_count: 0, forks_count: 0, fork: true },
            { name: 'frida-gadget-patcher', html_url: 'https://github.com/zgff667/frida-gadget-patcher', description: 'Frida Gadget自动注入工具', language: 'Python', stargazers_count: 0, forks_count: 0, fork: true },
            { name: 'Patcherbot', html_url: 'https://github.com/zgff667/Patcherbot', description: 'Android APK自动化补丁工具', language: 'Python', stargazers_count: 0, forks_count: 0, fork: true },
            { name: 'lasting-yang-frida-script', html_url: 'https://github.com/zgff667/lasting-yang-frida-script', description: 'Frida常用脚本集合 - Hook/Trace/Bypass', language: 'JavaScript', stargazers_count: 0, forks_count: 0, fork: true },
            { name: 'geekbyteR', html_url: 'https://github.com/zgff667/geekbyteR', description: '极客技术学习笔记与工具集', language: 'Python', stargazers_count: 0, forks_count: 0, fork: true },
        ];

        const CACHE_KEY = 'gh_cache_' + USERNAME;
        const CACHE_DURATION = 30 * 60 * 1000;

        function getCache() {
            try {
                const cached = localStorage.getItem(CACHE_KEY);
                if (cached) {
                    const data = JSON.parse(cached);
                    if (Date.now() - data.timestamp < CACHE_DURATION) return data;
                }
            } catch (e) {}
            return null;
        }

        function setCache(profile, repos) {
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify({ profile, repos, timestamp: Date.now() }));
            } catch (e) {}
        }

        function renderStats(user) {
            document.getElementById('stat-repos').textContent = user.public_repos;
            document.getElementById('stat-followers').textContent = user.followers;
            document.getElementById('stat-following').textContent = user.following;
        }

        function renderRepos(repos) {
            if (!repos || repos.length === 0) {
                repos = FALLBACK_REPOS;
            }
            const sorted = repos.sort((a, b) => b.stargazers_count - a.stargazers_count);
            document.getElementById('repos').innerHTML = sorted.map(repo => `
                <div class="repo-card">
                    <a href="${repo.html_url}" target="_blank">${repo.name}</a>
                    ${repo.fork ? '<span style="font-size:0.75rem;color:var(--text-secondary);margin-left:8px;">fork</span>' : ''}
                    <div class="desc">${repo.description || '暂无描述'}</div>
                    <div class="meta">
                        ${repo.language ? `<span><span class="lang-dot" style="background:${LANG_COLORS[repo.language] || '#8a8a9a'}"></span>${repo.language}</span>` : ''}
                        <span>⭐ ${repo.stargazers_count}</span>
                        <span>🍴 ${repo.forks_count}</span>
                    </div>
                </div>
            `).join('');
        }

        async function load() {
            const fallback = { public_repos: 20, followers: 2, following: 18 };

            const cache = getCache();
            if (cache) {
                renderStats(cache.profile);
                renderRepos(cache.repos);
                return;
            }

            renderStats(fallback);

            try {
                const profileRes = await fetch(`https://api.github.com/users/${USERNAME}`);
                if (profileRes.ok) {
                    const user = await profileRes.json();
                    if (user.login) renderStats(user);

                    let allRepos = [];
                    let page = 1;
                    while (true) {
                        const res = await fetch(`https://api.github.com/users/${USERNAME}/repos?per_page=100&page=${page}&sort=updated`);
                        if (!res.ok) break;
                        const repos = await res.json();
                        if (!Array.isArray(repos) || !repos.length) break;
                        allRepos = allRepos.concat(repos);
                        if (repos.length < 100) break;
                        page++;
                    }
                    renderRepos(allRepos.length > 0 ? allRepos : FALLBACK_REPOS);
                    setCache(user, allRepos.length > 0 ? allRepos : FALLBACK_REPOS);
                } else {
                    renderRepos(FALLBACK_REPOS);
                }
            } catch (e) {
                renderRepos(FALLBACK_REPOS);
            }
        }

        load();
    </script>
</body>
</html>
