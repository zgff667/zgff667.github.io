<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zgff667 - GitHub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .profile {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid #30363d;
        }
        .info { flex: 1; min-width: 250px; }
        .info h1 { font-size: 28px; margin-bottom: 5px; }
        .info .username { color: #8b949e; font-size: 18px; margin-bottom: 15px; }
        .info .bio { color: #8b949e; margin-bottom: 15px; font-size: 15px; }
        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .stat {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px 20px;
            text-align: center;
        }
        .stat .num {
            font-size: 24px;
            font-weight: bold;
            color: #58a6ff;
        }
        .stat .label {
            font-size: 12px;
            color: #8b949e;
            margin-top: 4px;
        }
        .section-title {
            font-size: 20px;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid #30363d;
        }
        .repos { display: grid; gap: 12px; }
        .repo {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px 20px;
            transition: border-color 0.2s;
        }
        .repo:hover { border-color: #58a6ff; }
        .repo a {
            color: #58a6ff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
        }
        .repo a:hover { text-decoration: underline; }
        .repo .desc {
            color: #8b949e;
            font-size: 14px;
            margin-top: 6px;
        }
        .repo .meta {
            margin-top: 10px;
            font-size: 12px;
            color: #8b949e;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .repo .meta span { display: flex; align-items: center; gap: 4px; }
        .lang-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .loading {
            text-align: center;
            color: #8b949e;
            padding: 40px;
            font-size: 16px;
        }
        .note {
            text-align: center;
            color: #8b949e;
            font-size: 13px;
            margin-top: 8px;
            font-style: italic;
        }
        @media (max-width: 600px) {
            .profile { flex-direction: column; align-items: center; text-align: center; }
            .stats { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile" id="profile"></div>
        <h2 class="section-title" id="repo-title">Repositories</h2>
        <div class="repos" id="repos">
            <div class="loading">Loading repositories...</div>
        </div>
    </div>

    <script>
        const USERNAME = 'zgff667';
        const LANG_COLORS = {
            'Python': '#3572A5', 'JavaScript': '#f1e05a', 'Java': '#b07219',
            'C': '#555555', 'C++': '#f34b7d', 'Go': '#00ADD8', 'Rust': '#dea584',
            'TypeScript': '#3178c6', 'HTML': '#e34c26', 'CSS': '#563d7c',
            'Shell': '#89e051', 'Kotlin': '#A97BFF', 'Swift': '#F05138',
            'Ruby': '#701516', 'PHP': '#4F5D95', 'Dart': '#00B4AB',
        };

        const FALLBACK_PROFILE = {
            login: 'zgff667',
            name: '学无止境',
            avatar_url: 'https://github.com/zgff667.png',
            bio: '很高兴和大家相识，让我们一起努力学习提升自己，能量大的时候去改变世界',
            public_repos: 20,
            followers: 2,
            following: 18
        };

        const CACHE_KEY = 'gh_cache_' + USERNAME;
        const CACHE_DURATION = 30 * 60 * 1000;

        function getCache() {
            try {
                const cached = localStorage.getItem(CACHE_KEY);
                if (cached) {
                    const data = JSON.parse(cached);
                    if (Date.now() - data.timestamp < CACHE_DURATION) return data;
                }
            } catch (e) {}
            return null;
        }

        function setCache(profile, repos) {
            try {
                localStorage.setItem(CACHE_KEY, JSON.stringify({ profile, repos, timestamp: Date.now() }));
            } catch (e) {}
        }

        function renderProfile(user) {
            document.getElementById('profile').innerHTML = `
                <img class="avatar" src="${user.avatar_url}" alt="avatar">
                <div class="info">
                    <h1>${user.name || USERNAME}</h1>
                    <div class="username">@${user.login}</div>
                    ${user.bio ? `<div class="bio">${user.bio}</div>` : ''}
                    <div class="stats">
                        <div class="stat"><div class="num">${user.public_repos}</div><div class="label">Repositories</div></div>
                        <div class="stat"><div class="num">${user.followers}</div><div class="label">Followers</div></div>
                        <div class="stat"><div class="num">${user.following}</div><div class="label">Following</div></div>
                    </div>
                </div>
            `;
        }

        function renderRepos(repos) {
            document.getElementById('repo-title').textContent = `Repositories (${repos.length})`;
            if (!repos || repos.length === 0) {
                document.getElementById('repos').innerHTML = '<div class="note">Repos will appear when GitHub API is available.</div>';
                return;
            }
            document.getElementById('repos').innerHTML = repos.map(repo => `
                <div class="repo">
                    <a href="${repo.html_url}" target="_blank">${repo.name}</a>
                    ${repo.fork ? '<span style="font-size:12px;color:#8b949e;"> (fork)</span>' : ''}
                    <div class="desc">${repo.description || 'No description'}</div>
                    <div class="meta">
                        ${repo.language ? `<span><span class="lang-dot" style="background:${LANG_COLORS[repo.language] || '#8b949e'}"></span>${repo.language}</span>` : ''}
                        <span>&#11088; ${repo.stargazers_count}</span>
                        <span>&#128274; ${repo.forks_count}</span>
                        <span>Updated: ${new Date(repo.updated_at).toLocaleDateString('zh-CN')}</span>
                    </div>
                </div>
            `).join('');
        }

        async function load() {
            const cache = getCache();
            if (cache) {
                renderProfile(cache.profile);
                renderRepos(cache.repos);
                return;
            }

            renderProfile(FALLBACK_PROFILE);

            try {
                const profileRes = await fetch(`https://api.github.com/users/${USERNAME}`);
                if (profileRes.ok) {
                    const user = await profileRes.json();
                    if (user.login) renderProfile(user);

                    let allRepos = [];
                    let page = 1;
                    while (true) {
                        const res = await fetch(`https://api.github.com/users/${USERNAME}/repos?per_page=100&page=${page}&sort=updated`);
                        if (!res.ok) break;
                        const repos = await res.json();
                        if (!Array.isArray(repos) || !repos.length) break;
                        allRepos = allRepos.concat(repos);
                        if (repos.length < 100) break;
                        page++;
                    }
                    renderRepos(allRepos);
                    setCache(user, allRepos);
                } else {
                    document.getElementById('repos').innerHTML = '<div class="note">Data updates when GitHub API is available.</div>';
                }
            } catch (e) {
                document.getElementById('repos').innerHTML = '<div class="note">Network error, showing cached info.</div>';
            }
        }

        load();
    </script>
</body>
</html>
